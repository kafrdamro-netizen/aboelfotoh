
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>منصة احترافية</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<style>
body{
    font-family:Arial;
    background:#0b1a2f;
    color:white;
    text-align:center;
}
.hidden{display:none}
.video{margin:20px auto;width:300px}
iframe{width:100%}
.btn{padding:10px 20px;background:#4da3ff;border:none;color:white;cursor:pointer}
</style>
</head>

<body>

<h1>منصتي التعليمية 🔥</h1>

<!-- Login -->
<div id="auth">
    <input id="email" placeholder="email"><br><br>
    <input id="pass" type="password" placeholder="password"><br><br>

    <button class="btn" onclick="signup()">تسجيل حساب</button>
    <button class="btn" onclick="login()">تسجيل دخول</button>
</div>

<!-- Content -->
<div id="content" class="hidden">

    <h2>الفيديوهات 🔒</h2>

    <div id="videos" class="hidden">
        <div class="video">
            <iframe src="https://www.youtube.com/embed/ysz5S6PUM-U"></iframe>
        </div>
    </div>

    <button class="btn" onclick="subscribe()">اشترك لفتح الفيديو</button>
    <br><br>
    <button onclick="logout()">تسجيل خروج</button>

</div>
<button onclick="test()">اختبار</button>

<script>
function test(){
    alert("Firebase شغال 🔥");
}
</script><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "stage-934c4.firebaseapp.com",
  projectId: "stage-934c4",
  appId: "1:994337495782:web:89502cbf25abde3d703927"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const email = document.getElementById("email");
const pass = document.getElementById("pass");
const authBox = document.getElementById("auth");
const content = document.getElementById("content");

window.signup = function(){
    createUserWithEmailAndPassword(auth, email.value, pass.value)
    .then(()=>alert("تم إنشاء الحساب"))
    .catch(err=>alert(err.message));
}

window.login = function(){
    signInWithEmailAndPassword(auth, email.value, pass.value)
    .then(()=>{
        authBox.style.display="none";
        content.classList.remove("hidden");
    })
    .catch(err=>alert(err.message));
}

window.logout = function(){
    signOut(auth);
    location.reload();
}
</script>

// اشتراك تجريبي
function subscribe(){
    document.getElementById("videos").classList.remove("hidden");
    alert("تم فتح الفيديوهات 🎉");
}
</script>

</body>
</html>
